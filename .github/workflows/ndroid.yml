name: Build AEmulator mali+ APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # secrets cannot be used in a step-level "if", so expose a flag here
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      # Builds THIS repository (pegiooos/AEmulator-mali-plus) as it is. Nothing is downloaded from upstream.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Check the project is in this repo
        run: |
          missing=0
          for f in gradlew settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [ ! -e "$f" ]; then echo "::error title=Missing file::$f is not in this repo"; missing=1; fi
          done
          if [ ! -d app/src/main/assets/engines ]; then
            echo "::warning title=No engines folder::app/src/main/assets/engines is not in this repo, so the APK will have no engine files"
          fi
          [ "$missing" = 0 ] || exit 1
          ls -la

      # A Windows JDK path in gradle.properties does not exist on Linux.
      - name: Fix gradle.properties for Linux
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties || true
          cat gradle.properties

      # Debug APK: installable with no secrets.
      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleStandardDebug 2>&1 | tee build.log

      # Optional signed release. Add repo secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Build signed release APK (only if secrets exist)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          ./gradlew --no-daemon --console=plain assembleStandardRelease

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            ERR=$(grep -E '^e: |error:|What went wrong|Could not |Execution failed|FAILED|Unresolved|SDK location' -A2 build.log | head -n 40 || true)
            [ -z "$ERR" ] && ERR=$(tail -n 40 build.log)
            { echo '### Build errors'; echo '```'; echo "$ERR"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: AEmulator-mali-plus-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          prerelease: true
          
