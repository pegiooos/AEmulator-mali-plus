name: Build AEmulator mali+ APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # only used to publish a GitHub Release on tags

env:
  UPSTREAM_ZIP: https://github.com/uxazu/AEmulator/archive/refs/tags/0.0.0.3.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/ndk 2>/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # The engine assets (big, not in this repo) come from the upstream AEmulator 0.0.0.3 source (GPL-3.0).
      # This repo's app/ folder and Gradle files are copied on top of it. No patch file is needed.
      - name: Get the source
        run: |
          if [ -d app/src/main/assets/engines ]; then
            D=.
            echo "Full project found in the repo"
          else
            curl -fL --retry 3 -o upstream.zip "$UPSTREAM_ZIP"
            mkdir -p src src_tmp
            unzip -q upstream.zip -d src_tmp
            mv src_tmp/*/* src/
            mv src_tmp/*/.[!.]* src/ 2>/dev/null || true
            rm -rf src_tmp upstream.zip
            cp -a app/. src/app/
            for f in gradlew gradlew.bat settings.gradle.kts build.gradle.kts gradle.properties LICENSE; do
              if [ -f "$f" ]; then cp "$f" src/; fi
            done
            if [ -d gradle ]; then cp -a gradle/. src/gradle/; fi
            D=src
          fi
          test -d "$D/app/src" || { echo "::error::$D has no app/src"; exit 1; }
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          ls -la "$D"

      # The upstream gradle.properties points Gradle at a Windows JDK path that does not exist on Linux.
      - name: Fix gradle.properties for Linux
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' "$PROJECT_DIR/gradle.properties" || true
          cat "$PROJECT_DIR/gradle.properties"

      # Debug APK: installable with no secrets (Android signs it with the debug key).
      - name: Build debug APK
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleStandardDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Optional signed release. Add repo secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Build signed release APK (only if secrets exist)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          ./gradlew --no-daemon --console=plain assembleStandardRelease

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            ERR=$(grep -E '^e: |error:|What went wrong|Could not |Execution failed|FAILED|Unresolved|SDK location' -A2 build.log | head -n 40 || true)
            [ -z "$ERR" ] && ERR=$(tail -n 40 build.log)
            { echo '### Build errors'; echo '```'; echo "$ERR"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No build.log: the build step did not start. See the earlier steps." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist
          find "$PROJECT_DIR/app/build/outputs/apk" -name '*.apk' -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: AEmulator-mali-plus-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          prerelease: true
